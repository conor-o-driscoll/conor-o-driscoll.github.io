project:
  type: website
  output-dir: _site

website:
  title: "Conor O'Driscoll"
  site-url: https://conor-o-driscoll.github.io
  description: "The personal website of Dr. Conor O'Driscoll"
  page-navigation: true
  back-to-top-navigation: true
  
  navbar:
    background: primary
    right:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "Contact"
        href: contact.qmd
  
  page-footer:
    left: "© 2024 Conor O'Driscoll · Made with [Quarto](https://quarto.org)"
    center: |
      <a class="link-dark me-1" href="https://github.com/conor-o-driscoll" title="GitHub" target="_blank" rel="noopener">{{< fa brands github >}}</a>

format:
  html:
    theme:
      light:
        - cosmo
        - custom.scss
    toc: true
    code-link: true
    link-external-newwindow: true

execute:
  freeze: auto
